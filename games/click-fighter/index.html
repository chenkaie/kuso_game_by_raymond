<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點擊格鬥與收服對戰遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
        .shake { animation: shake 0.25s ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4 select-none">
    <div class="max-w-3xl w-full bg-slate-800 border-2 border-indigo-500 rounded-2xl p-6 shadow-2xl">
        <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
            <h1 class="text-2xl font-black text-amber-400">⚔️ 點擊格鬥與收服對戰</h1>
            <div class="flex gap-2">
                <button onclick="setMode(1)" class="mode-btn px-3 py-1 rounded bg-indigo-600 font-bold text-sm" data-m="1">1v1</button>
                <button onclick="setMode(2)" class="mode-btn px-3 py-1 rounded bg-slate-700 font-bold text-sm" data-m="2">2v2</button>
                <button onclick="setMode(3)" class="mode-btn px-3 py-1 rounded bg-slate-700 font-bold text-sm" data-m="3">3v3</button>
            </div>
        </div>
        <div id="battle-arena" class="grid grid-cols-2 gap-6 bg-slate-950 p-5 rounded-xl border border-slate-700 mb-4">
            <div>
                <h2 class="text-cyan-400 font-bold mb-2">🛡️ 我方戰隊</h2>
                <div id="ally-list" class="space-y-2"></div>
            </div>
            <div>
                <h2 class="text-rose-400 font-bold mb-2">👹 敵方陣容</h2>
                <div id="enemy-list" class="space-y-2"></div>
            </div>
        </div>
        <div class="mb-4">
            <div class="flex justify-between text-xs font-bold mb-1">
                <span class="text-amber-300">⚡ 終極一擊必殺集氣</span>
                <span id="rage-txt">0 / 100%</span>
            </div>
            <div class="w-full h-3 bg-slate-700 rounded-full overflow-hidden">
                <div id="rage-bar" class="h-full bg-gradient-to-r from-amber-500 to-red-500 transition-all" style="width:0%"></div>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="attack()" class="flex-1 py-4 bg-blue-600 hover:bg-blue-500 active:scale-95 rounded-xl font-black text-lg shadow-lg">👊 快速點擊攻擊</button>
            <button id="ult-btn" onclick="ultimate()" disabled class="flex-1 py-4 bg-slate-700 text-slate-400 rounded-xl font-black text-lg transition-all">💥 一擊必殺爆發</button>
        </div>
        <div id="capture-box" class="hidden mt-4 p-4 bg-emerald-900/60 border border-emerald-400 rounded-xl flex justify-between items-center">
            <span id="capture-msg" class="font-bold text-emerald-300"></span>
            <button onclick="captureEnemy()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-lg">✨ 一鍵收服入隊</button>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-700">
            <div class="text-xs text-slate-400 mb-1">已收服角色圖鑑（點擊切換出戰）：</div>
            <div id="roster" class="flex flex-wrap gap-2"></div>
        </div>
    </div>
    <script>
        const enemyPool = [
            { name: "街頭惡霸", hp: 80, atk: 12, icon: "🥊" },
            { name: "暗影刺客", hp: 120, atk: 20, icon: "🥷" },
            { name: "深淵魔王", hp: 220, atk: 35, icon: "😈" },
            { name: "鋼鐵巨像", hp: 180, atk: 25, icon: "🤖" }
        ];
        let roster = [{ name: "見習格鬥家", maxHp: 120, atk: 18, icon: "🥋" }];
        let mode = 1, allies = [], enemies = [], rage = 0, lastDefeated = null;

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.className = `mode-btn px-3 py-1 rounded font-bold text-sm ${Number(b.dataset.m)===m ? 'bg-indigo-600' : 'bg-slate-700'}`;
            });
            startBattle();
        }
        function startBattle() {
            document.getElementById('capture-box').classList.add('hidden');
            allies = [];
            for(let i=0; i<mode; i++) {
                const base = roster[i % roster.length];
                allies.push({ ...base, hp: base.maxHp });
            }
            enemies = [];
            for(let i=0; i<mode; i++) {
                const e = enemyPool[Math.floor(Math.random()*enemyPool.length)];
                enemies.push({ ...e, maxHp: e.hp });
            }
            render();
        }
        function attack() {
            const target = enemies.find(e => e.hp > 0);
            if(!target) return;
            const totalAtk = allies.filter(a=>a.hp>0).reduce((s,a)=>s+a.atk, 0);
            target.hp = Math.max(0, target.hp - totalAtk);
            rage = Math.min(100, rage + 20);
            const arena = document.getElementById('battle-arena');
            arena.classList.remove('shake'); void arena.offsetWidth; arena.classList.add('shake');
            if(target.hp === 0) lastDefeated = target;
            if(enemies.every(e => e.hp <= 0)) {
                document.getElementById('capture-msg').textContent = `🎉 勝利！可收服【${lastDefeated.name}】！`;
                document.getElementById('capture-box').classList.remove('hidden');
            }
            render();
        }
        function ultimate() {
            if(rage < 100) return;
            rage = 0;
            enemies.forEach(e => { if(e.hp > 0) { lastDefeated = e; e.hp = 0; } });
            document.getElementById('capture-msg').textContent = `💥 終極大爆發清場！可收服【${lastDefeated.name}】！`;
            document.getElementById('capture-box').classList.remove('hidden');
            render();
        }
        function captureEnemy() {
            if(lastDefeated && !roster.some(r => r.name === lastDefeated.name)) {
                roster.push({ name: lastDefeated.name, maxHp: lastDefeated.maxHp, atk: lastDefeated.atk, icon: lastDefeated.icon });
            }
            startBattle();
        }
        function render() {
            document.getElementById('rage-bar').style.width = rage + '%';
            document.getElementById('rage-txt').textContent = `${rage} / 100%`;
            const ult = document.getElementById('ult-btn');
            ult.disabled = rage < 100;
            ult.className = rage >= 100 ? "flex-1 py-4 bg-gradient-to-r from-amber-500 to-red-600 text-white rounded-xl font-black text-lg shadow-lg animate-pulse" : "flex-1 py-4 bg-slate-700 text-slate-400 rounded-xl font-black text-lg";
            document.getElementById('ally-list').innerHTML = allies.map(a => `<div class="bg-slate-900 p-2 rounded border border-cyan-500/30 text-sm">${a.icon} ${a.name} <span class="text-cyan-300">HP ${a.hp}/${a.maxHp}</span></div>`).join('');
            document.getElementById('enemy-list').innerHTML = enemies.map(e => `<div class="bg-slate-900 p-2 rounded border border-rose-500/30 text-sm">${e.icon} ${e.name} <span class="text-rose-300">HP ${e.hp}/${e.maxHp}</span></div>`).join('');
            document.getElementById('roster').innerHTML = roster.map(r => `<span class="px-2.5 py-1 bg-slate-700 rounded text-xs font-bold">${r.icon} ${r.name} (ATK ${r.atk})</span>`).join('');
        }
        startBattle();
    </script>
</body>
</html>
