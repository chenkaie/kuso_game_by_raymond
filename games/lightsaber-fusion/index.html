<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>第一人稱光劍合成大戰</title><style>body{margin:0;background:#0b1328;color:white;font-family:system-ui;text-align:center}header,.shop{background:#172644;padding:10px}canvas{display:block;margin:8px auto;background:#172644;width:min(98vw,850px);aspect-ratio:850/450;border-radius:12px;border:2px solid #5575a9;touch-action:none}button,select{background:#294574;color:white;border:1px solid #7898c5;border-radius:10px;padding:12px;font-size:15px;touch-action:none}.controls{display:flex;justify-content:space-around;align-items:center;gap:8px;max-width:850px;margin:10px auto}.pad{display:grid;grid-template-columns:repeat(3,58px);gap:4px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.shop{max-width:830px;margin:auto;border-radius:12px}.shop select{max-width:42%;margin:5px}.shop button{margin:4px}#msg{color:#ffdc86;min-height:28px}small{color:#bbd2f4}</style><header><h2>⚔️ 第一人稱光劍合成大戰</h2><div id="hud"></div></header><canvas id="c" width="850" height="450"></canvas><div id="msg"></div><div class="controls"><div class="pad"><span></span><button data-key="up">⬆️</button><span></span><button data-key="left">⬅️</button><button data-key="down">⬇️</button><button data-key="right">➡️</button></div><div class="actions"><button data-key="attack">⚔️ 攻擊</button><button id="blast">✨ 劍氣</button><button id="face">🎯 面向敵人</button><button id="next">🏆 下一關</button></div></div><section class="shop"><h3>🛒 光劍商店與異種合成</h3><small>可以把不同形狀的兩把劍合成新造型！購買後選擇兩把劍再按合成。</small><div><select id="buySelect"></select><button id="buy">🪙 購買</button></div><div><select id="a"></select>＋<select id="b"></select><button id="fuse">🔥 合成</button></div><div id="inventory"></div></section><script>
const $=id=>document.getElementById(id),canvas=$('c'),g=canvas.getContext('2d');const base=[['藍色直光劍','straight','#54c2ff',15,25],['綠色彎月劍','curve','#55ffb5',20,45],['紫色雙刃劍','double','#c18aff',25,70],['紅色十字劍','cross','#ff6278',32,110],['金色巨劍','giant','#ffdb62',42,175],['彩虹光劍','rainbow','#ff9ef0',56,260]];let s;try{s=JSON.parse(localStorage.getItem('fusion-fps-v1'))}catch(e){}s=s&&Array.isArray(s.items)&&s.items.length?s:null;s=s||{gold:100,level:1,items:[{id:1,...make(0)}],eq:1,next:2};function make(i){let a=base[i];return{name:a[0],shape:a[1],color:a[2],power:a[3],price:a[4]}}let {gold,level,items}=s,eq=s.eq,nextId=s.next;let p={x:0,z:0,hp:100,angle:0},e,win=false,dead=false,keys={},cd=0,swing=0,blastCD=0,last=performance.now();function save(){localStorage.setItem('fusion-fps-v1',JSON.stringify({gold,level,items,eq,next:nextId}))}function w(){return items.find(v=>v.id===eq)||items[0]}function say(t){$('msg').textContent=t}function start(){p={x:0,z:0,hp:100,angle:0};e={x:0,z:7,hp:70+level*35,max:70+level*35,cd:1.4,power:10+level*5,shape:base[Math.min(5,Math.floor((level-1)/2))][1]};win=dead=false;say('第 '+level+' 關！敵人也會升級武器。')}function ui(){let v=w();$('hud').textContent=`❤️ ${Math.ceil(p.hp)}　🪙 ${gold}　🏆 第 ${level} 關　⚔️ ${v.name} 傷害 ${v.power}`;let opts=items.map(v=>`<option value="${v.id}">${v.name} (${v.power})</option>`).join('');for(let k of ['a','b']){let old=$(k).value;$(k).innerHTML=opts;if(items.some(v=>String(v.id)===old))$(k).value=old}$('inventory').innerHTML=items.map(v=>`<button data-eq="${v.id}" style="border-color:${v.color};${eq===v.id?'background:#5873a6':''}">${v.name} ⚔️${v.power}${eq===v.id?' ✓':''}</button>`).join('');document.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{eq=+b.dataset.eq;save();ui()})}$('buySelect').innerHTML=base.map((v,i)=>`<option value="${i}">${v[0]} 🪙${v[4]}</option>`).join('');$('buy').onclick=()=>{let v=make(+$('buySelect').value);if(gold<v.price)return say('金幣不夠！');gold-=v.price;v.id=nextId++;items.push(v);eq=v.id;save();ui();say('購買成功！')};$('fuse').onclick=()=>{let a=items.find(v=>v.id===+$('a').value),b=items.find(v=>v.id===+$('b').value);if(!a||!b||a.id===b.id)return say('請選擇兩把不同的劍！');let key=[a.shape,b.shape].sort().join('+');let recipe={'curve+straight':['青焰鉤刃','hook'],'double+straight':['雙星長槍','spear'],'cross+straight':['十字刺劍','cross'],'curve+double':['旋月雙鐮','scythe'],'cross+double':['四翼光刃','quad'],'cross+curve':['血月戰鐮','scythe'],'giant+straight':['巨型光槍','spear'],'double+giant':['雙頭巨刃','quad'],'curve+giant':['月蝕巨鐮','scythe'],'cross+giant':['王者十字巨劍','cross']}[key];let shapes=['hook','spear','quad','scythe'];let shape=recipe?recipe[1]:a.shape===b.shape?a.shape:shapes[(a.id+b.id)%4];let name=recipe?recipe[0]:a.shape===b.shape?'強化・'+a.name:'混沌・'+a.name+'×'+b.name;let v={id:nextId++,name,shape,color:a.color,power:Math.round(Math.max(a.power,b.power)*(a.shape===b.shape?1.4:1.7)),price:0};items=items.filter(x=>x.id!==a.id&&x.id!==b.id);items.push(v);eq=v.id;save();ui();say('✨ 合成成功！'+name+'，新造型與更強攻擊力！')};$('next').onclick=()=>{if(win){level++;save()}start();ui()};$('face').onclick=()=>{p.angle=Math.atan2(e.x-p.x,e.z-p.z)};function dist(){return Math.hypot(e.x-p.x,e.z-p.z)}function aim(){let a=Math.atan2(e.x-p.x,e.z-p.z)-p.angle;return Math.abs(Math.atan2(Math.sin(a),Math.cos(a)))<.8}function victory(){if(win)return;win=true;let prize=25+level*15;gold+=prize;save();ui();say('🏆 勝利！獲得 '+prize+' 金幣！按下一關。')}function hit(){if(win||dead||cd>0)return;cd=.38;swing=.25;if(dist()<2.5&&aim()){e.hp-=w().power;ui();if(e.hp<=0)victory()}}$('blast').onclick=()=>{if(blastCD||win||dead)return;blastCD=3;swing=.3;if(dist()<10&&aim()){e.hp-=w().power*2;if(e.hp<=0)victory()}say('✨ 發射光劍衝擊波！')};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=t=>{t.preventDefault();keys[k]=true;if(b.setPointerCapture)try{b.setPointerCapture(t.pointerId)}catch(_){}if(k==='attack')hit()};for(let ev of ['pointerup','pointercancel','pointerleave','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});let km={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',' ':'attack'};onkeydown=t=>{if(km[t.key]){keys[km[t.key]]=true;t.preventDefault()}if(t.key==='q')p.angle-=.18;if(t.key==='e')p.angle+=.18};onkeyup=t=>{if(km[t.key])keys[km[t.key]]=false};function line(x,y,X,Y,color,width=7,glow=0){g.save();g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.shadowColor=color;g.shadowBlur=glow;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke();g.restore()}function sword(x,y,size,v,rotation=0){g.save();g.translate(x,y);g.rotate(rotation);g.scale(size,size);line(0,28,0,-10,'#b9c4da',12);line(-18,4,18,4,'#d1daeb',8);let c=v.color;let beam=(x,y,X,Y,n=10)=>line(x,y,X,Y,c,n,22);if(['curve','hook','scythe'].includes(v.shape)){g.save();g.strokeStyle=c;g.lineWidth=12;g.shadowColor=c;g.shadowBlur=24;g.beginPath();g.moveTo(0,-12);g.quadraticCurveTo(68,-92,v.shape==='scythe'?-55:-15,-142);g.stroke();g.restore();if(v.shape==='hook')beam(-15,-142,-43,-117,7)}else if(v.shape==='spear'){beam(0,-12,0,-160);beam(0,-160,-17,-133,6);beam(0,-160,17,-133,6)}else{beam(0,-12,0,v.shape==='giant'?-170:-125,v.shape==='giant'?24:11);if(['double','quad'].includes(v.shape))beam(0,28,0,85);if(['cross','quad'].includes(v.shape))beam(-42,-36,42,-36);if(v.shape==='rainbow')for(let i=0;i<5;i++)line(-8+i*4,-16,-8+i*4,-130,['#ff5d77','#ffdd66','#70ff9e','#63caff','#d18bff'][i],4,12)}g.restore()}function project(x,z){let dx=x-p.x,dz=z-p.z,co=Math.cos(p.angle),si=Math.sin(p.angle),side=dx*co-dz*si,front=dx*si+dz*co;return{front,x:425+side*450/Math.max(.2,front)}}function frame(t){let dt=Math.min(.04,(t-last)/1000);last=t;if(!win&&!dead){let f=(keys.up?1:0)-(keys.down?1:0),side=(keys.right?1:0)-(keys.left?1:0),n=Math.hypot(f,side)||1;p.x=Math.max(-12,Math.min(12,p.x+(f*Math.sin(p.angle)+side*Math.cos(p.angle))/n*4*dt));p.z=Math.max(-12,Math.min(12,p.z+(f*Math.cos(p.angle)-side*Math.sin(p.angle))/n*4*dt));if(keys.attack)hit();let d=dist();if(d>1.8){let speed=Math.min(3.5,1.2+level*.12);e.x+=(p.x-e.x)/d*speed*dt;e.z+=(p.z-e.z)/d*speed*dt}e.cd-=dt;if(d<2.1&&e.cd<=0){p.hp=Math.max(0,p.hp-e.power);e.cd=Math.max(.6,1.5-level*.04);ui();if(p.hp===0){dead=true;say('💔 挑戰失敗！按下一關重新挑戰。')}}}cd=Math.max(0,cd-dt);swing=Math.max(0,swing-dt);blastCD=Math.max(0,blastCD-dt);g.fillStyle='#142747';g.fillRect(0,0,850,225);g.fillStyle='#192f3d';g.fillRect(0,225,850,225);g.strokeStyle='#37556b';for(let z=-12;z<=12;z+=2){let a=project(-12,z),b=project(12,z);if(a.front>.3&&b.front>.3){g.beginPath();g.moveTo(a.x,225+260/a.front);g.lineTo(b.x,225+260/b.front);g.stroke()}}for(let x=-12;x<=12;x+=2){g.beginPath();let active=false;for(let z=-12;z<=12;z+=.5){let q=project(x,z);if(q.front>.3){let y=225+260/q.front;if(!active){g.moveTo(q.x,y);active=true}else g.lineTo(q.x,y)}}g.stroke()}let q=project(e.x,e.z);if(q.front>.3){let sc=Math.min(3,3/q.front),y=235+Math.min(135,160/q.front);g.save();g.translate(q.x,y);g.scale(sc,sc);g.strokeStyle='#ff957d';g.lineWidth=6;g.lineCap='round';g.beginPath();g.arc(0,-66,15,0,7);g.moveTo(0,-51);g.lineTo(0,-8);g.moveTo(0,-37);g.lineTo(-24,-15);g.moveTo(0,-37);g.lineTo(25,-17);g.moveTo(0,-8);g.lineTo(-19,22);g.moveTo(0,-8);g.lineTo(19,22);g.stroke();sword(29,-20,.52,{shape:e.shape,color:'#ff6c6c'},-.5);g.restore();g.fillStyle='#251c30';g.fillRect(q.x-40,y-140*sc,80,9);g.fillStyle='#ff746a';g.fillRect(q.x-40,y-140*sc,80*Math.max(0,e.hp/e.max),9)}sword(625,420,1.6,w(),-.4+(swing>0?-1.15*Math.sin(swing/.3*Math.PI):0));line(412,225,438,225,'#e5f5ff',2);line(425,212,425,238,'#e5f5ff',2);g.fillStyle='#cfe0f5';g.font='16px system-ui';g.fillText('第一人稱・平面競技場　Q/E 轉向',15,27);if(win||dead){g.fillStyle='#000a';g.fillRect(190,155,470,110);g.fillStyle='white';g.font='bold 32px system-ui';g.textAlign='center';g.fillText(win?'🏆 勝利！':'💔 挑戰失敗',425,220);g.textAlign='start'}requestAnimationFrame(frame)}try{start();ui();requestAnimationFrame(frame)}catch(err){document.getElementById('msg').textContent='遊戲載入失敗：'
