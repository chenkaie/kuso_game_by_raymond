-size:13px;font-weight:900;white-space:nowrap}.actions{display:flex;gap:7px}.hand-label{padding:0 13px 6px;font-size:12px;color:#c7cee6}.hand{display:flex;gap:8px;overflow:auto;padding:3px 12px 17px;scroll-snap-type:x proximity;scrollbar-width:thin}.card{background:linear-gradient(165deg,#324679,#151a37);color:#fff;border:2px solid #6989cc;border-radius:15px;width:123px;min-width:123px;height:193px;position:relative;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;scroll-snap-align:start;transition:transform .15s;text-align:center}.card:active{transform:translateY(-6px)}.card.kaiju{background:linear-gradient(160deg,#3d6d51,#142d35);border-color:#80c092}.card.poke{background:linear-gradient(160deg,#90633e,#392943);border-color:#eab765}.card.mix{background:linear-gradient(160deg,#775995,#292857);border-color:#b49aff}.card.unaffordable{opacity:.55;filter:saturate(.6)}.card.chosen{outline:3px solid #ffcd63;transform:translateY(-5px)}.card .cost{position:absolute;left:-6px;top:-7px;background:#3379df;color:#fff;border:2px solid #a8d1ff;border-radius:50%;width:29px;height:29px;display:grid;place-items:center;font-size:16px;font-weight:950}.card .art{height:73px;line-height:73px;font-size:49px;filter:drop-shadow(0 6px 6px #0005)}.card strong{font-size:13px;line-height:16px;white-space:normal}.card .desc{font-size:10px;line-height:13px;color:#d6def2;flex:1;display:grid;place-items:center}.card .meta{display:flex;width:100%;justify-content:space-between;padding:0 5px;font-weight:950;font-size:13px}.hint{font-size:11px;text-align:center;color:#b5bbd6;padding:0 9px 6px;min-height:23px}.log{border-top:1px solid #353c62;margin:0 12px;padding:8px 0 14px;color:#a5afce;font-size:11px;line-height:1.7}.log b{color:#ece4ab}.start{max-width:820px;margin:24px auto;padding:18px}.start h1{font-size:clamp(24px,5vw,40px);line-height:1.2;margin:7px 0 12px;background:linear-gradient(90deg,#fdd77d,#e9a4fb);color:transparent;background-clip:text}.start p{font-size:14px;color:#c4c9e7}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:22px 0}.team{border:1px solid #6e7dab;background:linear-gradient(145deg,#34345f,#181b38);border-radius:19px;padding:17px;text-align:left;color:white;min-height:153px;position:relative;overflow:hidden}.team:nth-child(2){border-color:#7bab82}.team:nth-child(3){border-color:#eac17b}.team:nth-child(4){border-color:#a992e5}.team .big{font-size:42px}.team h3{margin:4px 0 6px;font-size:17px}.team p{margin:0;font-size:12px}.team:active{transform:scale(.98)}.rules{border:1px solid #5b587e;background:#ffffff09;padding:12px 15px;border-radius:12px;color:#b6bfdc;font-size:12px;line-height:1.65}.overlay{position:absolute!important;inset:0;background:#060a1bd9;display:grid;place-items:center;padding:16px;z-index:10}.dialog{width:min(400px,100%);background:linear-gradient(145deg,#363667,#171c3e);padding:24px;border:1px solid #aa93e3;border-radius:22px;text-align:center;box-shadow:0 20px 70px #0009}.dialog h2{font-size:29px}.dialog p{color:#ccd1ef;line-height:1.65}.dialog .ui-btn{margin:5px}.flair{font-size:58px}.desktop-grid{max-width:850px;margin:0 auto}.spellmsg{background:#bd8b4b30;color:#ffe0ab;border:1px solid #b78e4e;border-radius:12px;margin:7px 12px;padding:9px 12px;font-size:12px;text-align:center}@media(min-width:700px){.card{width:142px;min-width:142px;height:206px}.board{gap:12px;min-height:136px}.unit{width:110px;height:123px}.card .art{font-size:54px}.top{padding-top:22px}}@media(max-width:420px){.unit{width:19%;height:108px}.unit .uemoji{font-size:29px}.unit .uname{font-size:9px}.board{gap:3px}.hero{margin:0 8px}.arena{padding:5px 8px}.ui-btn{padding:8px 9px}.brand{font-size:16px}.team{min-height:144px;padding:12px}}
</style></head><body><div id="game"><div style="padding:28px;text-align:center;color:white;font-family:system-ui">
<h1>🌌 宇宙卡牌大亂鬥</h1><p>星際大戰 × 哥吉拉 × 寶可夢</p>
<p>遊戲正在載入。如果一直停在這裡，表示目前的檔案預覽器不支援互動遊戲。</p>
<p>請將 HTML 檔儲存到「檔案」，再使用 Safari 或 Chrome 開啟。</p></div></div><script>
(()=>{
const root=document.getElementById('game');
const F={star:{name:'星際大戰',icon:'⚔️',power:'原力衝擊：對敵方造成 2 傷害'},kaiju:{name:'哥吉拉怪獸',icon:'🦖',power:'怪獸怒吼：友軍全體攻擊 +1'},poke:{name:'寶可夢',icon:'⚡',power:'進化之光：抽 1 張，友軍 +1/+1'},mix:{name:'宇宙聯盟',icon:'🌌',power:'奇蹟能量：回復 3 血、抽 1 張'}};
const D={
 s1:['star','暴風兵','💂',1,2,2,'unit','','基本戰士'],s2:['star','光劍學徒','🗡️',2,3,2,'unit','rush','速攻：召喚當回合可攻擊'],s3:['star','R2-D2','🤖',2,1,4,'unit','draw','出場：抽一張卡'],s4:['star','X翼戰機','🚀',3,4,3,'unit','rush','速攻飛行'],s5:['star','尤達大師','🧙',4,4,5,'unit','guard','守護：優先被攻擊'],s6:['star','達斯維達','🌑',6,7,7,'unit','smash','出場：敵方全體受 2 傷害'],s7:['star','原力閃電','⚡',2,0,0,'spell','bolt3','指定敵人造成 3 傷害'],s8:['star','反抗軍集結','✨',3,0,0,'spell','boost','己方全體 +1/+1'],
 g1:['kaiju','迷你哥吉拉','🦕',1,2,3,'unit','','怪獸幼體'],g2:['kaiju','拉頓','🦅',2,3,2,'unit','rush','速攻：可立即攻擊'],g3:['kaiju','摩斯拉','🦋',2,2,4,'unit','heal','出場：英雄回復 3 血'],g4:['kaiju','金剛','🦍',3,4,4,'unit','guard','守護：擋住敵方攻擊'],g5:['kaiju','機械哥吉拉','🦾',5,6,6,'unit','guard','守護：鋼鐵防線'],g6:['kaiju','哥吉拉','🦖',6,7,8,'unit','smash','出場：敵方全體受 2 傷害'],g7:['kaiju','原子吐息','☄️',3,0,0,'spell','bolt4','指定敵人造成 4 傷害'],g8:['kaiju','怪獸暴走','🌋',4,0,0,'spell','quake','敵方全體單位受 3 傷害'],
 p1:['poke','妙蛙種子','🌱',1,1,4,'unit','heal','出場：英雄回復 3 血'],p2:['poke','皮卡丘','⚡',2,3,2,'unit','zap','出場：敵方英雄受 2 傷害'],p3:['poke','小火龍','🔥',2,3,3,'unit','','火焰戰士'],p4:['poke','傑尼龜','🐢',2,2,4,'unit','guard','守護：優先被攻擊'],p5:['poke','快龍','🐉',4,5,5,'unit','rush','速攻：立即攻擊'],p6:['poke','超夢','🔮',6,7,7,'unit','draw2','出場：抽兩張卡'],p7:['poke','十萬伏特','🌩️',2,0,0,'spell','bolt3','指定敵人造成 3 傷害'],p8:['poke','超級進化','💫',3,0,0,'spell','boost2','己方單位全體 +2/+1']};
const defs=Object.fromEntries(Object.entries(D).map(([id,v])=>[id,{id,fac:v[0],name:v[1],icon:v[2],cost:v[3],atk:v[4],hp:v[5],type:v[6],fx:v[7],desc:v[8]}]));
let game=null,record={wins:0,losses:0},showHelp=false,seq=0;
const rand=n=>Math.floor(Math.random()*n), shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];}return a};
const teams=['star','kaiju','poke','mix'];
const nameOf=t=>F[t].name;
function deck(t){let ids=Object.keys(defs).filter(k=>t==='mix'||defs[k].fac===t);let list=[]; if(t==='mix'){for(const id of ids) list.push(id);} else {for(const id of ids)for(let i=0;i<3;i++)list.push(id);}return shuffle(list)}
function player(team){return {team,hp:30,maxHp:30,maxMana:3,mana:3,board:[],hand:[],deck:deck(team),powerUsed:false,fatigue:0}}
function start(team){seq=0;let others=teams.filter(t=>t!==team),opp=others[rand(others.length)];game={p:player(team),e:player(opp),turn:1,busy:false,over:false,selected:null,log:[],message:'',winner:null};draw('p',5);draw('e',5);note('🎮 對戰開始！召喚角色、施放技能，擊倒敵方英雄。');render();}
function note(t){if(!game)return;game.log.unshift(t);game.log=game.log.slice(0,4)}
function draw(side,n=1){let h=game[side];for(let i=0;i<n;i++){if(h.deck.length)h.hand.push(h.deck.pop());else{h.fatigue++;h.hp=Math.max(0,h.hp-h.fatigue);if(h.hp<=0)finish(side==='p'?'e':'p');}}}
function finish(w){if(game.over)return;game.over=true;game.winner=w;if(w==='p')record.wins++;else record.losses++;note(w==='p'?'🏆 你獲勝了！':'💥 電腦贏了這局。');}
function dmg(side,n){game[side].hp=Math.max(0,game[side].hp-n);if(game[side].hp<=0)finish(side==='p'?'e':'p')}
function clean(){for(const s of ['p','e'])game[s].board=game[s].board.filter(u=>u.hp>0)}
function allied(side){return game[side]}
function other(side){return side==='p'?'e':'p'}
function fxApply(d,side){let me=game[side],opp=game[other(side)];switch(d.fx){case 'heal':me.hp=Math.min(me.maxHp,me.hp+3);break;case 'zap':dmg(other(side),2);break;case 'draw':draw(side,1);break;case 'draw2':draw(side,2);break;case 'smash':opp.board.forEach(u=>u.hp-=2);clean();break;case 'boost':me.board.forEach(u=>{u.atk++;u.hp++;u.maxHp++});break;case 'boost2':me.board.forEach(u=>{u.atk+=2;u.hp++;u.maxHp++});break;case 'quake':opp.board.forEach(u=>u.hp-=3);clean();break;}}
function summon(side,id){let d=defs[id],h=game[side];let unit={id:++seq,card:id,atk:d.atk,hp:d.hp,maxHp:d.hp,ready:d.fx==='rush'};h.board.push(unit);fxApply(d,side);note(`${side==='p'?'你':'電腦'}召喚「${d.name}」`);}
function playCard(side,i){let h=game[side],id=h.hand[i],d=defs[id];if(!d||d.cost>h.mana||game.over)return false;if(d.type==='unit'&&h.board.length>=5)return false;h.mana-=d.cost;h.hand.splice(i,1);if(d.type==='unit')summon(side,id);else{fxApply(d,side);note(`${side==='p'?'你':'電腦'}施放「${d.name}」`)}return true;}
function playSpellBolt(side,i,target){let h=game[side],d=defs[h.hand[i]];if(!d||!d.fx.startsWith('bolt')||h.mana<d.cost)return;let tgt=game[other(side)];if(target!=='hero'&&!(tgt.board.some(u=>u.id===target)))return;h.mana-=d.cost;h.hand.splice(i,1);let damage=Number(d.fx.replace('bolt',''));if(target==='hero')dmg(other(side),damage);else{tgt.board.find(u=>u.id===target).hp-=damage;clean()}note(`${d.name}造成 ${damage} 點傷害！`);game.selected=null;render()}
function guards(side){return game[side].board.filter(u=>defs[u.card].fx==='guard')}
function attack(side,id,target){let h=game[side],e=game[other(side)],a=h.board.find(u=>u.id===id);if(!a||!a.ready||game.over)return false;if(guards(other(side)).length&& (target==='hero'||!guards(other(side)).some(u=>u.id===target))){if(side==='p')game.message='🛡️ 必須先擊敗有「守護」的單位';return false;}a.ready=false;if(target==='hero'){dmg(other(side),a.atk);note(`${defs[a.card].name} 攻擊英雄，造成 ${a.atk} 傷害`)}else{let b=e.board.find(u=>u.id===target);if(!b)return false;let ad=a.atk,bd=b.atk;a.hp-=bd;b.hp-=ad;note(`${defs[a.card].name} ⚔️ ${defs[b.card].name}`);clean()}return true;}
function power(side){let h=game[side],foe=game[other(side)];if(game.over||h.mana<2||h.powerUsed)return false;h.mana-=2;h.powerUsed=true;switch(h.team){case 'star':{if(foe.board.length){let u=[...foe.board].sort((a,b)=>b.atk-a.atk)[0];u.hp-=2;clean()}else dmg(other(side),2);break}case 'kaiju':if(h.board.length)h.board.forEach(u=>u.atk++);else dmg(other(side),2);break;case 'poke':draw(side,1);if(h.board.length){let u=h.board[rand(h.board.length)];u.atk++;u.hp++;u.maxHp++}break;case 'mix':h.hp=Math.min(30,h.hp+3);draw(side,1);break;}note(`${side==='p'?'你':'電腦'}發動英雄技能！`);return true;}
function canAct(){return game&&!game.busy&&!game.over}
function selectCard(i){if(!canAct())return;let id=game.p.hand[i],d=defs[id];if(!d)return;if(d.cost>game.p.mana){game.message='⚡ 能量不足，等下回合再出牌';return render()}if(d.type==='spell'&&d.fx.startsWith('bolt')){game.selected={kind:'spell',index:i};game.message='🎯 點擊敵方英雄或單位，選擇技能目標';return render()}if(d.type==='unit'&&game.p.board.length>=5){game.message='場上最多只能有 5 個角色';return render()}game.selected=null;game.message='';playCard('p',i);render()}
function selectOwn(id){if(!canAct())return;let u=game.p.board.find(u=>u.id===id);if(!u)return;if(!u.ready){game.message='角色下回合才可攻擊（速攻角色除外）';return render()}game.selected={kind:'attack',id};game.message='⚔️ 點擊敵方英雄或單位發動攻擊';render()}
function targetEnemy(target){if(!canAct())return;let s=game.selected;if(!s){game.message='先點選已準備好的我方角色，或一張傷害卡牌';return render()}if(s.kind==='spell')return playSpellBolt('p',s.index,target);if(s.kind==='attack'){attack('p',s.id,target);game.selected=null;render()}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function endTurn(){if(!canAct())return;game.busy=true;game.selected=null;game.message='🤖 電腦正在出牌…';render();await sleep(480);let e=game.e;e.maxMana=Math.min(10,Math.max(3,game.turn+2));e.mana=e.maxMana;e.powerUsed=false;draw('e',1);if(game.over){render();return;}for(let k=0;k<6&&!game.over;k++){let opts=e.hand.map((id,i)=>({d:defs[id],i})).filter(x=>x.d.cost<=e.mana&&(x.d.type==='spell'||e.board.length<5)).sort((a,b)=>b.d.cost-a.d.cost);if(!opts.length)break;let c=opts[0];if(c.d.fx.startsWith('bolt')){let index=c.i,target=game.p.board.length?[...game.p.board].sort((a,b)=>b.atk-a.atk)[0].id:'hero';playSpellBolt('e',index,target)}else playCard('e',c.i);render();await sleep(260);}if(!game.over&&e.mana>=2){power('e');render();await sleep(260)}for(const a of [...e.board]){if(game.over)break;if(!a.ready)continue;let gs=guards('p'),target;if(gs.length)target=gs[rand(gs.length)].id;else if(game.p.board.length&&Math.random()<.54)target=game.p.board[rand(game.p.board.length)].id;else target='hero';attack('e',a.id,target);render();await sleep(320)}if(!game.over){game.turn++;game.p.maxMana=Math.min(10,game.p.maxMana+1);game.p.mana=game.p.maxMana;game.p.powerUsed=false;game.p.board.forEach(u=>u.ready=true);e.board.forEach(u=>u.ready=true);draw('p',1);game.message='輪到你了！你可以抽卡、出牌、攻擊。';note(`✨ 第 ${game.turn} 回合，能量 ${game.p.mana}/${game.p.maxMana}`)}game.busy=false;render();}
const ehtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function unitHtml(u,side){let d=defs[u.card],sel=game.selected,active=side==='p'?u.ready:!!sel;let target=side==='e'&&!!sel;return `<button class="unit ${d.fac} ${active?'ready':'not-ready'} ${sel?.kind==='attack'&&sel.id===u.id?'selected':''} ${target?'targetable':''}" data-a="${side==='p'?'own':'target'}" data-id="${u.id}" aria-label="${d.name}"><span class="uemoji">${d.icon}</span><span class="uname">${ehtml(d.name)}</span>${d.fx==='guard'?'<span class="tag">🛡守護</span>':''}<span class="numbers"><b>⚔${u.atk}</b><b>♥${u.hp}</b></span></button>`}
function cardHtml(id,i){let d=defs[id],selected=game.selected?.kind==='spell'&&game.selected.index===i;return `<button class="card ${d.fac} ${d.cost>game.p.mana?'unaffordable':''} ${selected?'chosen':''}" data-a="card" data-id="${i}" title="${ehtml(d.desc)}"><span class="cost">${d.cost}</span><span class="art">${d.icon}</span><strong>${ehtml(d.name)}</strong><span class="desc">${ehtml(d.desc)}</span><span class="meta"><span>${d.type==='unit'?'⚔ '+d.atk:'✦ 技能'}</span><span>${d.type==='unit'?'♥ '+d.hp:' '}</span></span></button>`}
function heroHtml(side){let h=game[side],op=side==='e';return `<div class="hero ${op?'enemy':''} ${op&&game.selected?'can-target':''}" ${op?'data-a="target" data-id="hero"':''}><div class="portrait">${F[h.team].icon}</div><div class="hero-info"><strong>${op?'電腦：':'你：'}${F[h.team].name}</strong><div class="sub">${op?'手牌 '+h.hand.length+' 張 · ':'剩餘卡牌 '+h.deck.length+' 張 · '}${op?'敵方英雄':'玩家英雄'}</div></div><div class="hp">♥ ${h.hp}<div class="hpro">/ 30 HP</div></div></div>`}
function startScreen(){return `<div class="start"><div class="tiny">CROSSOVER CARD ARENA</div><h1>🌌 星際大戰 × 哥吉拉 × 寶可夢</h1><p>組成你的夢幻卡組！召喚知名角色、施放超級絕招，與電腦進行回合制卡牌對戰。</p><div class="teams">${teams.map(t=>`<button class="team" data-a="start" data-id="${t}"><div class="big">${F[t].icon}</div><h3>${F[t].name}</h3><p>${F[t].power}</p></button>`).join('')}</div><div class="rules">📜 <b>玩法：</b>先選一副卡組。每回合使用⚡能量打出手牌；點選發光的己方角色，再點敵人發動攻擊。🛡守護角色必須優先擊敗。把對手的 30 點生命值降到 0 就獲勝！</div><p style="text-align:center;font-size:12px">🏆 目前戰績：${record.wins} 勝 / ${record.losses} 敗</p></div>`}
function helpOverlay(){return `<div class="overlay"><div class="dialog"><div class="flair">📚</div><h2>卡牌規則</h2><p style="text-align:left;font-size:13px">① 點擊下方卡牌召喚角色或施放法術。<br>② ⚡能量每回合增加，最高 10。<br>③ 角色通常下一回合才能攻擊；「速攻」能立即攻擊。<br>④ 先選擇已發光的己方角色，再點擊敵人。<br>⑤ 「守護」必須優先攻擊。<br>⑥ 英雄技能每回合可用一次，消耗 2 能量。<br>⑦ 每邊最多召喚 5 個單位。</p><button class="ui-btn primary" data-a="help-close">了解！</button></div></div>`}
function gameScreen(){let p=game.p,e=game.e;return `<div class="desktop-grid"><header class="top"><div class="brand">🌌 宇宙卡牌大亂鬥<small>STAR × KAIJU × POKÉMON</small></div><div class="tiny">第 ${game.turn} 回合<br>🏆 ${record.wins} 勝 / ${record.losses} 敗</div><button class="ui-btn" data-a="help">❔規則</button></header>${heroHtml('e')}<section class="arena"><div class="board">${e.board.length?e.board.map(u=>unitHtml(u,'e')).join(''):'<div class="empty">敵方戰場 · 點擊這裡無法攻擊，請點擊敵方英雄</div>'}</div></section><div class="divider">VS · ${game.busy?'電腦回合':'你的回合'}</div><section class="arena"><div class="board">${p.board.length?p.board.map(u=>unitHtml(u,'p')).join(''):'<div class="empty">你的戰場 · 從下方召喚角色</div>'}</div></section>${heroHtml('p')}<div class="hud"><div class="energy">⚡ ${p.mana} / ${p.maxMana} 能量</div><div class="actions"><button class="ui-btn" data-a="power" ${!canAct()||p.mana<2||p.powerUsed?'disabled':''} title="${ehtml(F[p.team].power)}">✨英雄技能 2⚡</button><button class="ui-btn primary" data-a="end" ${!canAct()?'disabled':''}>結束回合 ➜</button></div></div>${game.selected?'<div class="spellmsg">🎯 已選擇目標攻擊，請點擊敵方角色或英雄。 <button class="ui-btn" style="padding:3px 8px" data-a="cancel">取消</button></div>':''}<div class="hint">${ehtml(game.message||'點卡牌出牌 · 發光的單位可攻擊 · 英雄技能每回合一次')}</div><div class="hand-label">🃏 手牌 ${p.hand.length} 張　｜　往左右滑動查看</div><div class="hand">${p.hand.length?p.hand.map(cardHtml).join(''):'<div class="empty">沒有手牌，下一回合會抽一張。</div>'}</div><div class="log"><b>戰鬥紀錄</b><div>${game.log.map(ehtml).join('　·　')}</div></div></div>${game.over?`<div class="overlay"><div class="dialog"><div class="flair">${game.winner==='p'?'🏆':'💫'}</div><h2>${game.winner==='p'?'你贏了！':'這回合輸了！'}</h2><p>${game.winner==='p'?'成功保衛宇宙！太厲害了！':'換一個卡組、試試新的戰術再挑戰！'}</p><p>戰績：${record.wins} 勝 / ${record.losses} 敗</p><button class="ui-btn primary" data-a="again">🔁 再戰一場</button><button class="ui-btn" data-a="choose">換卡組</button></div></div>`:''}${showHelp?helpOverlay():''}`}
function render(){root.innerHTML=game?gameScreen():startScreen()}
root.addEventListener('click',ev=>{let b=ev.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,id=b.dataset.id;if(a==='start')start(id);else if(a==='choose'){game=null;render()}else if(a==='again')start(game.p.team);else if(a==='card')selectCard(Number(id));else if(a==='own')selectOwn(Number(id));else if(a==='target')targetEnemy(id==='hero'?'hero':Number(id));else if(a==='power'){if(canAct()){power('p');render()}}else if(a==='end')endTurn();else if(a==='cancel'){game.selected=null;game.message='';render()}else if(a==='help'){showHelp=true;render()}else if(a==='help-close'){showHelp=false;render()}});
render();
})();
</script></body></html>
