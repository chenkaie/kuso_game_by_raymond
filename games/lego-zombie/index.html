<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 樂高殭屍生存遊戲 (CS 樂高版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
    <style>body{margin:0;overflow:hidden;user-select:none}.cross{position:absolute;top:50%;left:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:2px solid #22c55e;border-radius:50%;pointer-events:none}</style>
</head>
<body class="bg-slate-900 text-white">
    <div class="absolute top-3 left-3 right-3 z-10 flex justify-between items-center bg-black/70 p-3 rounded-xl border border-emerald-500">
        <div class="font-black text-emerald-400">🔫 CS 樂高版：3D 殭屍生存 | 擊殺: <span id="kills">0</span></div>
        <div class="flex gap-2 text-xs font-bold">
            <button onclick="setWeapon('ak47')" class="px-3 py-1.5 bg-amber-600 rounded">AK-47</button>
            <button onclick="setWeapon('sniper')" class="px-3 py-1.5 bg-blue-600 rounded">狙擊槍 (右鍵/按鈕開鏡)</button>
            <button onclick="throwGrenade()" class="px-3 py-1.5 bg-red-600 rounded">💣 手榴彈</button>
        </div>
    </div>
    <div class="cross" id="scope"></div>
    <div class="absolute bottom-4 left-4 right-4 z-10 flex justify-between items-end">
        <div class="flex gap-2">
            <button onpointerdown="move(-1,0)" class="w-12 h-12 bg-white/20 rounded-xl font-bold">⬅️</button>
            <button onpointerdown="move(0,-1)" class="w-12 h-12 bg-white/20 rounded-xl font-bold">⬆️</button>
            <button onpointerdown="move(0,1)" class="w-12 h-12 bg-white/20 rounded-xl font-bold">⬇️</button>
            <button onpointerdown="move(1,0)" class="w-12 h-12 bg-white/20 rounded-xl font-bold">➡️</button>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleZoom()" class="px-4 py-4 bg-sky-600 rounded-full font-bold">🔭 開鏡</button>
            <button onclick="shoot()" class="px-6 py-4 bg-red-600 rounded-full font-black">🔥 射擊</button>
        </div>
    </div>
    <canvas id="c" class="block w-screen h-screen"></canvas>
    <script type="module">
        import * as THREE from 'three';
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1e293b);
        const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 100);
        camera.position.set(0, 1.7, 8);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.2));

        const floor = new THREE.Mesh(new THREE.BoxGeometry(40, 0.5, 40), new THREE.MeshLambertMaterial({ color: 0x475569 }));
        scene.add(floor);

        // Cover walls (Blocks bullets!)
        const walls = [];
        [[-3, 1.2, 2], [3, 1.2, 0], [0, 1.2, -3]].forEach(p => {
            const w = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.4, 0.8), new THREE.MeshLambertMaterial({ color: 0xd97706 }));
            w.position.set(...p); scene.add(w); walls.push(w);
        });

        // Equal-height Lego NPC Allies
        function createLegoChar(color) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.45), new THREE.MeshLambertMaterial({ color }));
            body.position.y = 0.75;
            const head = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.4, 16), new THREE.MeshLambertMaterial({ color: 0xfacc15 }));
            head.position.y = 1.45; // Matches player 1.7m eye height proportionally
            g.add(body, head); return g;
        }
        const ally1 = createLegoChar(0x2563eb); ally1.position.set(-2, 0.25, 6); scene.add(ally1);
        const ally2 = createLegoChar(0x2563eb); ally2.position.set(2, 0.25, 6); scene.add(ally2);

        const zombies = [];
        let kills = 0, weapon = 'ak47', zoomed = false;
        function spawnZombie() {
            const z = createLegoChar(0x16a34a);
            z.position.set((Math.random()-0.5)*14, 0.25, -14);
            z.userData = { hp: 60 };
            scene.add(z); zombies.push(z);
        }
        window.setWeapon = w => { weapon = w; zoomed = false; camera.fov = 70; camera.updateProjectionMatrix(); };
        window.toggleZoom = () => { zoomed = !zoomed; camera.fov = zoomed ? 30 : 70; camera.updateProjectionMatrix(); };
        window.move = (dx, dz) => { camera.position.x += dx*0.8; camera.position.z += dz*0.8; };
        window.throwGrenade = () => {
            zombies.forEach(z => { if(z.position.distanceTo(camera.position) < 15) z.userData.hp -= 80; });
        };
        const raycaster = new THREE.Raycaster();
        window.shoot = () => {
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const wallHits = raycaster.intersectObjects(walls);
            const wallDist = wallHits.length > 0 ? wallHits[0].distance : Infinity;
            const zMeshes = [];
            zombies.forEach(z => z.children.forEach(c => { c.userData.parent = z; zMeshes.push(c); }));
            const zHits = raycaster.intersectObjects(zMeshes);
            if(zHits.length > 0 && zHits[0].distance < wallDist) {
                zHits[0].object.userData.parent.userData.hp -= (weapon==='sniper' ? 100 : 35);
            }
        };
        setInterval(() => { if(zombies.length < 6) spawnZombie(); }, 2500);
        function animate() {
            requestAnimationFrame(animate);
            for(let i=zombies.length-1; i>=0; i--) {
                const z = zombies[i];
                z.position.z += 0.025;
                if(z.userData.hp <= 0) { scene.remove(z); zombies.splice(i,1); kills++; document.getElementById('kills').textContent = kills; }
                else if(z.position.z > 8) { z.position.z = -14; }
            }
            renderer.render(scene, camera);
        }
        spawnZombie(); animate();
    </script>
</body>
</html>
